name: Build Debug APK

on:
  push:
    branches: [ "feature/app-debug" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: 17

    - name: Build debug APK
      run: ./gradlew assembleDebug

